[package]
name = "consensus-retrieval"
version = "0.1.0"
edition = "2024"

[[bench]]
harness = false
name = "query"

[[bench]]
harness = false
name = "construct"

[dependencies]
ahash = "0.8.12"
clap = { version = "4.6.4", features = ["derive"] }
indicatif = "0.18.6"
mem_dbg = "0.4.4"
statrs = { version = "0.19.0", default-features = false, features = ["std"] }
sux = "0.14.0"

[dev-dependencies]
criterion = "0.8.2"
human_bytes = "0.4.3"
rand = "0.10.2"

[profile.release]
debug = true
strip = false
# lto = "thin"
# codegen-units = 1
