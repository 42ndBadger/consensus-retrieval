[package]
name = "consensus-retrieval"
version = "0.1.0"
edition = "2024"

[[bench]]
harness = false
name = "query"

[[bench]]
harness = false
name = "construct"

[[bench]]
harness = false
name = "hash"

[dependencies]
ahash = "0.8.12"
bitvec = "1.1.1"
clap = { version = "4.6.4", features = ["derive"] }
fxhash = "0.2.1"
indicatif = "0.18.6"
mem_dbg = "0.4.4"
rand = "0.10.2"
rand_distr = "0.6.0"
sux = "0.14.0"

[dev-dependencies]
criterion = "0.8.2"
human_bytes = "0.4.3"
rand = "0.10.2"

[profile.release]
debug = true
strip = false
lto = "thin"
codegen-units = 1
